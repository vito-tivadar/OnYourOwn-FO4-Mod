[General]
bEnabled=1
; Log: 0 = none, 1 = everything, 2 = locations, 3 = quest markers, 4 = player & quest hiding, 5 = map zoom & centering, 6 = compass
iLogLevel=0

[Locations]
bShowUndiscovered=0
bShowDiscovered=1
bShowDiscoveredSettlements=1

; Map choice: 0 = always show, 1 = world map only, 2 = local map only, 3 = never show
[Quests]
iQuestObjectives=3
iMiscObjectives=3
iQuestDoors=3
; Quest markers floating over the target in the world (HUD)
bShowFloatingMarkers=0

[Markers]
iPlayer=1
iCustomWaypoint=1
iPowerArmor=1

; HUD compass. All on = the compass is left untouched (vanilla / iHUD behaviour).
[Compass]
bShowCompass=1
bShowQuests=0
bShowEnemies=0
bShowUndiscovered=0
bShowDiscovered=1
bShowCustomWaypoint=1
bShowDirections=1
